name: LastTimeI
options:
  bundleIdPrefix: com.greenteabiscuit
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: 93Z4HA76J6
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1'
targets:
  LastTimeI:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greenteabiscuit.lasttimei
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 'Last Time I…'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
    info:
      path: App/Info.plist
      properties:
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [lasttimei]
    entitlements:
      path: App/LastTimeI.entitlements
      properties:
        com.apple.security.application-groups: [group.com.greenteabiscuit.lasttimei]
    dependencies:
      - target: LastTimeWidget
  LastTimeWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greenteabiscuit.lasttimei.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 'Last Time I…'
        SKIP_INSTALL: YES
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/LastTimeWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.greenteabiscuit.lasttimei]
  LastTimeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: LastTimeI
  LastTimeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: LastTimeI
schemes:
  LastTimeI:
    build:
      targets:
        LastTimeI: all
    test:
      targets: [LastTimeTests, LastTimeUITests]
